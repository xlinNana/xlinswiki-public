name: Deploy XLinsWiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Prepare published content
        run: |
          rm -rf content
          cp -a content-github content
          python3 scripts/prepare_github_pages_content.py

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npm run install-plugins

      - name: Configure project-site URL
        run: |
          cp quartz.config.default.yaml quartz.config.yaml
          sed -i 's#^  baseUrl:.*#  baseUrl: xlinNana.github.io/xlinswiki-public#' quartz.config.yaml

      - name: Check types and formatting
        run: npm run check -- --ignore-path .prettierignore

      - name: Build Quartz
        run: npm run quartz -- build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
